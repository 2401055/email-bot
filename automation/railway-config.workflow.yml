name: Railway infrastructure

on:
  push:
    branches: [main]
    paths:
      - '.railway/**'
      - 'railway-services/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Apply Railway project graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Railway Infrastructure as Code
        uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
