<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Bot Hub | Railway</title><style>body{font-family:system-ui;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:1000px;margin:3rem auto;padding:1.5rem}.card{padding:1.25rem;border:1px solid #334155;border-radius:1rem;background:#111827;margin:1rem 0}h1,h2{margin-top:0}a{color:#67e8f9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem}.item{padding:1rem;border:1px solid #334155;border-radius:.7rem;background:#0b1220}.muted{color:#94a3b8;font-size:.9rem}pre{white-space:pre-wrap;overflow:auto;color:#a7f3d0}</style></head><body><main><div class="card"><h1>Email Bot Hub</h1><p>البوت المركزي الذي يجمع خدمات Railway المجهزة وروابط Workers الموجودة على Cloudflare.</p><p><a href="/health">Health</a> · <a href="/api/bot-menu">Bot Menu API</a> · <a href="/api/projects">Projects API</a></p></div><div class="card"><h2>خدمات Railway المجهزة</h2><div id="services" class="grid">جاري التحميل...</div></div><div class="card"><h2>البوتات المرتبطة</h2><div id="bots" class="grid">جاري التحميل...</div></div><div class="card"><h2>حالة التكامل</h2><pre id="status">جاري التحميل...</pre></div></main><script>Promise.all([fetch('/api/railway-services').then(r=>r.json()),fetch('/api/bots').then(r=>r.json()),fetch('/api/projects').then(r=>r.json())]).then(([s,b,p])=>{document.getElementById('services').innerHTML=s.services.map(x=>`<div class="item"><b>${x.title}</b><div class="muted">${x.category} · port ${x.port}</div><div class="muted">${x.needs.join(' · ')}</div></div>`).join('');document.getElementById('bots').innerHTML=b.bots.map(x=>`<div class="item"><b>${x.name}</b><div class="muted">${x.status}</div><a href="${x.url}" target="_blank" rel="noreferrer">فتح الرابط</a></div>`).join('');document.getElementById('status').textContent=JSON.stringify({mode:'railway-integrated-catalog',preparedServices:s.services.length,cloudflareBots:b.bots.length,otherProjects:p.inventory.length},null,2)}).catch(e=>document.getElementById('status').textContent='تعذر تحميل البيانات')</script></body></html>
