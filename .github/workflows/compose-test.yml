name: Docker Compose service test

on:
  workflow_dispatch:
  push:
    paths:
      - 'docker-compose.yml'
      - 'railway-services/**'
      - '.github/workflows/compose-test.yml'

permissions:
  contents: read

jobs:
  compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h /
          docker version
          docker compose version

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Capture resource usage
        if: always()
        run: |
          echo '--- docker stats ---'
          docker stats --no-stream || true
          echo '--- disk usage ---'
          df -h /
          echo '--- compose images ---'
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: Check service endpoints
        run: |
          set +e
          for item in \
            'searxng|http://127.0.0.1:8080' \
            'reactive-resume|http://127.0.0.1:3000' \
            'changedetection|http://127.0.0.1:5000' \
            'suwayomi|http://127.0.0.1:4567' \
            'libretranslate|http://127.0.0.1:5001' \
            'archivebox|http://127.0.0.1:8000' \
            'vaultwarden|http://127.0.0.1:8081'; do
            service="${item%%|*}"
            endpoint="${item#*|}"
            printf '%s -> ' "$service"
            for attempt in $(seq 1 36); do
              code=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' "$endpoint")
              if [ "$code" != "000" ]; then printf '%s (attempt %s)\n' "$code" "$attempt"; break; fi
              sleep 5
            done
            if [ "$code" = "000" ]; then echo 'unreachable after 180s'; fi
          done

      - name: Start public temporary service links
        run: |
          set -e
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          mkdir -p /tmp/service-tunnels
          : > service-urls.txt
          for item in \
            'SearXNG|8080' \
            'Reactive Resume|3000' \
            'changedetection.io|5000' \
            'Suwayomi|4567' \
            'LibreTranslate|5001' \
            'ArchiveBox|8000' \
            'Vaultwarden|8081'; do
            name="${item%%|*}"
            port="${item#*|}"
            slug=$(printf '%s' "$name" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')
            cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:${port}" > "/tmp/service-tunnels/${slug}.log" 2>&1 &
            echo $! > "/tmp/service-tunnels/${slug}.pid"
          done
          sleep 12
          for log in /tmp/service-tunnels/*.log; do
            url=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$log" | head -1 || true)
            slug=$(basename "$log" .log)
            if [ -n "$url" ]; then printf '%s|%s\n' "$slug" "$url" | tee -a service-urls.txt; else echo "${slug}|unavailable" | tee -a service-urls.txt; fi
          done
          cat service-urls.txt >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          links = {}
          for line in open('service-urls.txt'):
              key, url = line.rstrip().split('|', 1)
              links[key] = url
          print(json.dumps(links))
          PY
          payload=$(python3 -c 'import json; print(json.dumps({"links": {k:v for k,v in (line.rstrip().split("|",1) for line in open("service-urls.txt"))}}))')
          curl -fsS -X POST 'https://email-bot.joserv.dpdns.org/api/service-links' -H 'content-type: application/json' --data "$payload"
      - name: Upload temporary service links
        uses: actions/upload-artifact@v4
        with:
          name: service-urls
          path: service-urls.txt
          retention-days: 1

      - name: Keep temporary services running
        run: |
          echo 'Services are running temporarily for 15 minutes.'
          sleep 900

      - name: Show logs for failed services
        if: always()
        run: docker compose logs --tail=120

      - name: Tear down temporary stack
        if: always()
        run: docker compose down -v --remove-orphans
