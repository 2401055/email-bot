name: Docker Compose service test

on:
  workflow_dispatch:
  push:
    paths:
      - 'docker-compose.yml'
      - 'railway-services/**'
      - '.github/workflows/compose-test.yml'

permissions:
  contents: read

jobs:
  compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h /
          docker version
          docker compose version

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Capture resource usage
        if: always()
        run: |
          echo '--- docker stats ---'
          docker stats --no-stream || true
          echo '--- disk usage ---'
          df -h /
          echo '--- compose images ---'
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: Check service endpoints
        run: |
          set +e
          for item in \
            'searxng|http://127.0.0.1:8080' \
            'reactive-resume|http://127.0.0.1:3000' \
            'changedetection|http://127.0.0.1:5000' \
            'suwayomi|http://127.0.0.1:4567' \
            'libretranslate|http://127.0.0.1:5001' \
            'archivebox|http://127.0.0.1:8000' \
            'vaultwarden|http://127.0.0.1:8081'; do
            service="${item%%|*}"
            endpoint="${item#*|}"
            printf '%s -> ' "$service"
            for attempt in $(seq 1 36); do
              code=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' "$endpoint")
              if [ "$code" != "000" ]; then printf '%s (attempt %s)\n' "$code" "$attempt"; break; fi
              sleep 5
            done
            if [ "$code" = "000" ]; then echo 'unreachable after 180s'; fi
          done

      - name: Show logs for failed services
        if: always()
        run: docker compose logs --tail=120

      - name: Tear down temporary stack
        if: always()
        run: docker compose down -v --remove-orphans
