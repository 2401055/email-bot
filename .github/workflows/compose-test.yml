name: Docker Compose service test

on:
  workflow_dispatch:
  push:
    paths:
      - 'docker-compose.yml'
      - 'railway-services/**'
      - '.github/workflows/compose-test.yml'

permissions:
  contents: read

jobs:
  compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h /
          docker version
          docker compose version

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Capture resource usage
        if: always()
        run: |
          echo '--- docker stats ---'
          docker stats --no-stream || true
          echo '--- disk usage ---'
          df -h /
          echo '--- compose images ---'
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: Check service endpoints
        run: |
          set +e
          for endpoint in \
            'http://127.0.0.1:8080' \
            'http://127.0.0.1:3000' \
            'http://127.0.0.1:5000' \
            'http://127.0.0.1:4567' \
            'http://127.0.0.1:5001' \
            'http://127.0.0.1:8000' \
            'http://127.0.0.1:8081'; do
            printf '%s -> ' "$endpoint"
            curl --max-time 10 -sS -o /dev/null -w '%{http_code}\n' "$endpoint" || echo 'unreachable'
          done

      - name: Show logs for failed services
        if: always()
        run: docker compose logs --tail=120

      - name: Tear down temporary stack
        if: always()
        run: docker compose down -v --remove-orphans
